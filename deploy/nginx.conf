# MemSOC gateway.
#
# This container serves the dashboard AND fronts both APIs on one origin,
# so there is a single place to read and exercise the whole HTTP surface:
#
#     http://localhost:8080/api-docs
#
# The prefixes below are what make the merged OpenAPI document honest.
# Both services expose GET /health, so a document that simply concatenated
# their specs would silently drop one. Proxying them under distinct
# prefixes gives every operation a real, callable path.
#
# These `location` prefixes MUST match DETECTION_PREFIX / REPORT_PREFIX in
# src/memsoc/api/routes_docs.py. If you change one, change the other.
#
# Upstream names resolve over the compose network; docker-compose.yml
# orders this container after both services so nginx can resolve them at
# startup.

server {
    listen       80;
    listen  [::]:80;
    server_name  localhost;

    # ------------------------------------------------------------------
    # Unified API documentation
    # ------------------------------------------------------------------

    # The merged spec is built by the report service, which fetches the
    # detection service's spec and folds it in. Exact-match location, so
    # it wins over the /api-docs/ prefix below.
    location = /api-docs/openapi.json {
        proxy_pass         http://report:8001/api/openapi/merged;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location = /api-docs {
        return 301 /api-docs/;
    }

    # Static Swagger UI page, shipped in the dashboard bundle at
    # dashboard/public/api-docs/index.html.
    location /api-docs/ {
        root  /usr/share/nginx/html;
        index index.html;
    }

    # ------------------------------------------------------------------
    # Service proxies
    #
    # The trailing slash on both the location and the proxy_pass target
    # strips the prefix, so /services/detection/api/logs reaches the
    # detection service as /api/logs.
    # ------------------------------------------------------------------

    location = /services/detection {
        return 301 /services/detection/;
    }

    location /services/detection/ {
        proxy_pass         http://detection:8000/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # The detection service unpickles ~37MB on first use and SHAP is
        # not instant; do not cut a legitimate inference short.
        proxy_read_timeout 120s;
    }

    location = /services/report {
        return 301 /services/report/;
    }

    location /services/report/ {
        proxy_pass         http://report:8001/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ------------------------------------------------------------------
    # Dashboard (static React bundle)
    # ------------------------------------------------------------------

    location / {
        root  /usr/share/nginx/html;
        index index.html index.htm;
    }

    error_page   500 502 503 504  /50x.html;

    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
