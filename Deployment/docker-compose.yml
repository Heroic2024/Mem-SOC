services:

  detection:
    image: memsoc-detection:latest
    container_name: memsoc-detection
    environment:
      MEMSOC_ROOT: /app
      MEMSOC_MODELS_DIR: /app/final_ml_model_v1/src/models
      MEMSOC_API_HOST: 0.0.0.0
      MEMSOC_API_BIND: 0.0.0.0
      MEMSOC_API_PORT: 8000
      PYTHONPATH: /app:/app/final_ml_model_v1
    ports:
      - "8000:8000"
    restart: unless-stopped

  report:
    image: memsoc-report:latest
    container_name: memsoc-report
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY}
      DETECTION_API_URL: http://detection:8000/api/logs
      PYTHONPATH: /app
    volumes:
      - ../LLMTriage/model_outputs:/app/LLMTriage/model_outputs
      - ../LLMTriage/reports:/app/LLMTriage/reports
    ports:
      - "8001:8001"
    depends_on:
      - detection
    restart: unless-stopped

  dashboard:
    image: memsoc-dashboard:latest
    container_name: memsoc-dashboard
    ports:
      - "8080:80"
    depends_on:
      - report
    restart: unless-stopped

  # Generates flow records and replays them against `detection` over HTTP
  # (--no-api: it never loads a model itself). The dataset lives outside
  # git -- point MEMSOC_HOST_DATA at the directory holding
  # NF-UNSW-NB15-v3.csv (paths.py walks it, so any depth works); defaults
  # to ../data, correct for a normal checkout. One-shot job, not a daemon,
  # so no restart policy: `docker compose up log_generation` runs the
  # batch demo once and exits.
  log_generation:
    build:
      context: ./log_generation
      dockerfile: Dockerfile
    image: memsoc-log-generation:latest
    container_name: memsoc-log-generation
    environment:
      MEMSOC_ROOT: /app
      MEMSOC_DATA_DIR: /data
      MEMSOC_ARTIFACTS_DIR: /artifacts
      MEMSOC_MODELS_DIR: /app/final_ml_model_v1/src/models
      MEMSOC_API_HOST: detection
      MEMSOC_API_PORT: 8000
      PYTHONPATH: /app
    volumes:
      - ${MEMSOC_HOST_DATA:-../data}:/data:ro
      - ./detection/final_ml_model_v1/src/models:/app/final_ml_model_v1/src/models:ro
      - memsoc-log-artifacts:/artifacts
    depends_on:
      - detection
    command: ["--flows", "100"]

volumes:
  memsoc-log-artifacts:
