<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MemSOC System Map</title>
<!--
  MemSOC system map: an interactive isometric diagram of the project as it
  stood on 2026-11-15 (branch aryan). Self-contained: open the file in a
  browser, no build step, no network.

  Every number and backlog reference on this page was typed in by hand from
  the sources named in the "Sources" section of the overview panel. Nothing
  is read live from the repo, so the page goes stale when those sources
  change (backlog BL-198).
-->
<style>
  :root {
    --bg: #d2c79c;
    --bg-2: #dbd1aa;
    --ink: #1d1b12;
    --mute: #6a6446;
    --rule: #8d855f;
    --grid: rgba(29, 27, 18, 0.13);
    --accent: #9c3a17;
    --mono: "IBM Plex Mono", "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--mono);
    font-size: 12px;
    line-height: 1.55;
    display: grid;
    grid-template-rows: auto 1fr;
    overflow: hidden;
  }
  button { font: inherit; color: inherit; background: none; border: 1px solid var(--ink); cursor: pointer; }
  button:focus-visible, .row:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .lbl { font-size: 9px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--mute); }

  /* ---------- top bar ---------- */
  header {
    display: flex; align-items: stretch; flex-wrap: wrap;
    border-bottom: 1px solid var(--ink);
  }
  .tile { padding: 7px 14px 8px; border-right: 1px solid var(--rule); min-width: 0; }
  .tile b { display: block; font-weight: 500; font-size: 13px; white-space: nowrap; }
  .arms { display: flex; align-items: center; gap: 0; padding: 0 12px; border-right: 1px solid var(--rule); }
  .arms button { padding: 5px 10px; font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; margin-left: -1px; }
  .arms button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
  .actions { margin-left: auto; display: flex; align-items: center; gap: 6px; padding: 6px 12px; }
  .actions button { padding: 5px 10px; font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; }
  .actions button:hover, .arms button:hover { background: var(--ink); color: var(--bg); }

  /* ---------- body ---------- */
  main { display: grid; grid-template-columns: 200px minmax(0, 1fr) 340px; min-height: 0; }
  nav { border-right: 1px solid var(--ink); overflow-y: auto; padding: 10px 8px 24px; }
  nav h2 { font-size: 9px; letter-spacing: 0.16em; font-weight: 400; color: var(--mute); margin: 14px 2px 6px; text-transform: uppercase; }
  nav h2:first-child { margin-top: 2px; }
  .row {
    display: grid; grid-template-columns: 14px 1fr auto; gap: 6px; align-items: baseline;
    width: 100%; text-align: left; padding: 5px 7px; margin-bottom: 4px;
    font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase;
  }
  .row .k { color: var(--mute); font-size: 9px; }
  .row .n { color: var(--mute); font-size: 9px; }
  .row.mem { border-color: var(--accent); }
  .row.mem .k { color: var(--accent); }
  .row:hover, .row.sel { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .row:hover .k, .row:hover .n, .row.sel .k, .row.sel .n { color: var(--bg); }

  /* ---------- canvas ---------- */
  #stage { position: relative; min-width: 0; min-height: 0; overflow: hidden; }
  svg { display: block; width: 100%; height: 100%; cursor: grab; touch-action: none; user-select: none; }
  svg.dragging { cursor: grabbing; }
  .gridline { stroke: var(--grid); stroke-width: 1; }
  .edge { fill: none; stroke: var(--ink); stroke-width: 1.3; }
  .edge.dash { stroke-dasharray: 4 3; stroke-width: 1; }
  .edge.mem { stroke: var(--accent); }
  .dot { fill: var(--ink); }
  .dot.mem { fill: var(--accent); }
  .face { stroke: var(--ink); stroke-width: 1; stroke-linejoin: round; }
  .node { cursor: pointer; }
  .node .letter { font-size: 12px; text-anchor: middle; fill: var(--ink); pointer-events: none; }
  .name { font-size: 8.5px; letter-spacing: 0.12em; text-anchor: middle; fill: var(--ink); stroke: var(--bg); stroke-width: 3.5; paint-order: stroke; pointer-events: none; text-transform: uppercase; }
  svg.far .name { display: none; }
  .name.mem { fill: var(--accent); }
  svg.arm-off .name.mem { opacity: 0.45; }
  .node.mem .face { stroke: var(--accent); }
  .node.mem .letter { fill: var(--accent); }
  .node:hover .face { stroke-width: 1.8; }
  .node.sel .top { fill: var(--ink); }
  .node.sel .letter { fill: var(--bg); }
  .node.act .face { stroke-width: 2; }
  .node.act .top { fill: var(--accent); }
  .node.act .letter { fill: var(--bg); }
  .region { fill: none; stroke: var(--accent); stroke-width: 1; stroke-dasharray: 6 4; }
  .gtext { font-size: 9px; letter-spacing: 0.22em; fill: var(--mute); }
  .gtext.mem { fill: var(--accent); }
  .only-off { display: none; }
  .trail { fill: none; stroke: var(--accent); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; opacity: 0.85; }
  .token { fill: var(--accent); stroke: var(--bg); stroke-width: 2; }

  /* Arm A: the memory layer is switched off */
  svg.arm-off .node.mem { opacity: 0.38; }
  svg.arm-off .node.mem .face { fill: var(--bg); stroke-dasharray: 3 2; }
  svg.arm-off .edge.mem, svg.arm-off .dot.mem { opacity: 0.3; }
  svg.arm-off .edge.mem { stroke-dasharray: 2 4; }
  svg.arm-off .only-on { display: none; }
  svg.arm-off .only-off { display: inline; }

  .zoom { position: absolute; top: 10px; right: 10px; display: grid; gap: 4px; }
  .zoom button { width: 22px; height: 22px; line-height: 1; background: var(--bg); }
  #caption {
    position: absolute; left: 12px; right: 12px; bottom: 30px;
    border: 1px solid var(--ink); background: var(--bg-2); padding: 7px 10px;
    display: none; max-width: 760px;
  }
  #caption.on { display: block; }
  #caption .lbl { color: var(--accent); margin-right: 10px; }
  #hints { position: absolute; left: 12px; bottom: 8px; right: 12px; white-space: nowrap; overflow: hidden; }
  #tip {
    position: fixed; pointer-events: none; z-index: 5; max-width: 300px;
    background: var(--ink); color: var(--bg); padding: 6px 9px; font-size: 11px; display: none;
  }
  #tip b { display: block; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; font-size: 10px; margin-bottom: 2px; }

  /* ---------- right panel ---------- */
  aside { border-left: 1px solid var(--ink); display: grid; grid-template-rows: auto 1fr; min-height: 0; }
  .tabs { display: grid; grid-template-columns: repeat(4, 1fr); border-bottom: 1px solid var(--ink); }
  .tabs button { border: 0; border-right: 1px solid var(--rule); padding: 8px 2px; font-size: 9px; letter-spacing: 0.1em; text-transform: uppercase; }
  .tabs button:last-child { border-right: 0; }
  .tabs button[aria-selected="true"] { background: var(--ink); color: var(--bg); }
  .tabs.hidden { display: none; }
  #panel { overflow-y: auto; padding: 14px 16px 40px; }
  #panel h1 { font-size: 16px; font-weight: 500; margin: 2px 0 2px; letter-spacing: 0.02em; }
  #panel .sub { color: var(--mute); font-size: 11px; margin: 0 0 14px; }
  #panel h3 { font-size: 9px; letter-spacing: 0.16em; font-weight: 400; color: var(--mute); text-transform: uppercase; border-bottom: 1px solid var(--ink); padding-bottom: 4px; margin: 18px 0 8px; }
  #panel p { margin: 0 0 10px; }
  #panel code { font-family: inherit; background: rgba(29, 27, 18, 0.1); padding: 0 3px; overflow-wrap: anywhere; }
  #panel mark { background: var(--ink); color: var(--bg); padding: 0 4px; }
  #panel ol { margin: 0; padding: 0; list-style: none; counter-reset: s; }
  #panel ol li { counter-increment: s; display: grid; grid-template-columns: 26px 1fr; padding: 6px 0; border-bottom: 1px dotted var(--rule); }
  #panel ol li::before { content: counter(s, decimal-leading-zero); color: var(--accent); font-size: 10px; padding-top: 1px; }
  .bl { display: grid; grid-template-columns: 64px 1fr; gap: 6px; padding: 6px 0; border-bottom: 1px dotted var(--rule); }
  .bl .id { font-size: 10px; letter-spacing: 0.06em; }
  .bl .id i { display: block; font-style: normal; color: var(--accent); font-size: 9px; letter-spacing: 0.12em; }
  .back { border: 0; padding: 0; margin-bottom: 10px; color: var(--mute); font-size: 9px; letter-spacing: 0.16em; text-transform: uppercase; }
  .back:hover { color: var(--ink); }
  table { width: 100%; border-collapse: collapse; margin: 0 0 10px; font-size: 11px; }
  th, td { text-align: right; padding: 4px 4px; border-bottom: 1px dotted var(--rule); font-weight: 400; }
  th:first-child, td:first-child { text-align: left; }
  thead th { font-size: 9px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--mute); border-bottom: 1px solid var(--ink); }
  .col-on { background: var(--ink); color: var(--bg); }
  thead th.col-on { color: var(--bg); }
  .note { color: var(--mute); font-size: 11px; }

  @media (max-width: 900px) {
    body { overflow: auto; display: block; }
    main { display: block; }
    nav { display: none; }
    #stage { height: 62vh; border-bottom: 1px solid var(--ink); }
    aside { border-left: 0; display: block; }
    #panel { overflow: visible; }
    .actions { margin-left: 0; }
  }
  @media (prefers-reduced-motion: reduce) { .trail { transition: none; } }
</style>
</head>
<body>

<header>
  <div class="tile"><span class="lbl">Repository</span><b>Mem-SOC · aryan</b></div>
  <div class="tile"><span class="lbl">Phase</span><b>5 of 5 · reporting</b></div>
  <div class="arms" role="group" aria-label="Experimental arm">
    <span class="lbl" style="margin-right:10px">Arm</span>
    <button data-arm="off" aria-pressed="false">A · no memory</button>
    <button data-arm="self" aria-pressed="true">B-self</button>
    <button data-arm="oracle" aria-pressed="false">B-oracle</button>
  </div>
  <div class="tile"><span class="lbl">Attacks caught</span><b id="s-recall"></b></div>
  <div class="tile"><span class="lbl">Family named right</span><b id="s-family"></b></div>
  <div class="tile"><span class="lbl">Harmless flows escalated</span><b id="s-benign"></b></div>
  <div class="tile"><span class="lbl">Backlog</span><b>174 rows · 120 not done</b></div>
  <div class="actions">
    <button id="b-run">▶ Run the flow</button>
    <button id="b-step">Trace one step</button>
    <button id="b-reset">Reset view</button>
  </div>
</header>

<main>
  <nav id="nav" aria-label="Components"></nav>

  <div id="stage">
    <svg id="svg" role="img" aria-label="Isometric diagram of the MemSOC pipeline: data stream, detector, memory layer, LLM triage, scoring and reporting.">
      <defs>
        <pattern id="p-top" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(-30)">
          <rect width="4" height="4" style="fill:var(--bg-2)"/><line x1="0" y1="0" x2="4" y2="0" style="stroke:var(--ink);stroke-width:.45"/>
        </pattern>
        <pattern id="p-left" width="2.4" height="4" patternUnits="userSpaceOnUse">
          <rect width="2.4" height="4" style="fill:var(--bg)"/><line x1="0" y1="0" x2="0" y2="4" style="stroke:var(--ink);stroke-width:.9"/>
        </pattern>
        <pattern id="p-right" width="4" height="4" patternUnits="userSpaceOnUse">
          <rect width="4" height="4" style="fill:var(--bg)"/><line x1="0" y1="0" x2="0" y2="4" style="stroke:var(--ink);stroke-width:.6"/>
        </pattern>
        <pattern id="m-top" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(-30)">
          <rect width="4" height="4" style="fill:var(--bg-2)"/><line x1="0" y1="0" x2="4" y2="0" style="stroke:var(--accent);stroke-width:.5"/>
        </pattern>
        <pattern id="m-left" width="2.4" height="4" patternUnits="userSpaceOnUse">
          <rect width="2.4" height="4" style="fill:var(--bg)"/><line x1="0" y1="0" x2="0" y2="4" style="stroke:var(--accent);stroke-width:.9"/>
        </pattern>
        <pattern id="m-right" width="4" height="4" patternUnits="userSpaceOnUse">
          <rect width="4" height="4" style="fill:var(--bg)"/><line x1="0" y1="0" x2="0" y2="4" style="stroke:var(--accent);stroke-width:.6"/>
        </pattern>
      </defs>
      <g id="world"></g>
    </svg>
    <div class="zoom"><button id="z-in" aria-label="Zoom in">+</button><button id="z-out" aria-label="Zoom out">−</button></div>
    <div id="caption" aria-live="polite"><span class="lbl" id="cap-n"></span><span id="cap-t"></span></div>
    <div id="hints" class="lbl">Click a block to read it · Double-click or Enter goes inside · ↑ ↓ move · Space runs the flow · Drag to pan · Scroll to zoom</div>
  </div>

  <aside>
    <div class="tabs hidden" id="tabs" role="tablist">
      <button data-tab="what" role="tab">What it does</button>
      <button data-tab="built" role="tab">How it's built</button>
      <button data-tab="inside" role="tab">Inside</button>
      <button data-tab="cond" role="tab">Condition</button>
    </div>
    <div id="panel"></div>
  </aside>
</main>

<div id="tip"></div>

<script>
"use strict";

/* ------------------------------------------------------------------
   Content. Hand-entered from the repo as of 2026-11-15; see "Sources"
   in the overview panel. `cond` rows are open backlog items.
   ------------------------------------------------------------------ */

const GROUPS = [
  ["The triage loop", ["D", "G", "L", "C", "T", "P", "M", "V"]],
  ["Layer 3 · memory, the variable", ["S", "X", "E", "R", "Q", "W"]],
  ["Measurement", ["O", "K", "H", "N"]],
  ["What comes out", ["A", "B", "I", "U", "Z"]],
  ["Supporting", ["J", "Y"]],
];

const NODES = {
  D: {
    name: "Dataset", x: 0, y: 8, w: 2, d: 2, h: 0.9, slabs: 3,
    sub: "the recorded traffic everything starts from",
    what: [
      "A public set of recorded network traffic, **NF-UNSW-NB15-v3**: about 2.36 million flows, each already labelled as harmless or as a named kind of attack.",
      "Only flows the detector never saw in training are used, so nothing downstream is marked on material it has already memorised.",
      "It is a lab capture, not real company traffic. That limit is stated wherever results are reported.",
    ],
    built: [
      "`NF-UNSW-NB15-v3.csv`, 55 columns, 2.36M rows. Not in the repo: it lives in `data/` (gitignored) and is bind-mounted into the containers.",
      "Found through `paths.find_dataset()`; `MEMSOC_DATASET_CSV` overrides it.",
      "The held-out row numbers are in `artifacts/heldout_rows.npy`, produced by the held-out split in `detection/training/`.",
    ],
    cond: [
      ["BL-100", "P1", "The usable held-out attack pool is 3,713 rows, not 470,122."],
      ["BL-162", "P4", "All results come from this one dataset and one stream."],
      ["BL-031", "P2", "Dropping rows with non-finite values tilts the mix toward Exploits; the size of the tilt was never measured."],
      ["BL-116", "P3", "Fresh-machine setup does not say where the dataset goes."],
    ],
  },
  G: {
    name: "Flow generator", x: 4, y: 8, w: 2, d: 2, h: 1,
    sub: "turns the dataset into a repeatable alert stream",
    what: [
      "Picks a sample of held-out flows and writes them out in a fixed, shuffled order. The same sample size always gives **the same sequence**, so every arm sees exactly the same alerts.",
      "The true labels go to a separate file. The stream itself carries no answer.",
    ],
    built: [
      "`src/memsoc/logstream/nfv3_log_generator.py`. `SEED = 42` is frozen; `MEMSOC_SAMPLE_SIZE` sets how many flows.",
      "Writes `artifacts/generated_logs.jsonl` (a Zeek-style envelope plus the 48 model features) and `artifacts/ground_truth.csv` (uid, label, attack).",
      "Stream version 2 (2026-10-10) restricts the pool to held-out rows. Version 1 overlapped the training set on 82% of its flows.",
    ],
    inside: [
      "Read the 48 feature column names.",
      "Keep only rows the detector never trained on.",
      "Drop rows with non-finite values.",
      "Seeded selection, then a seeded shuffle.",
      "Check each record against the 48-feature contract.",
      "Write the stream and, separately, the ground truth.",
    ],
    cond: [
      ["BL-022", "P1", "Every run silently overwrites the previous stream and its ground truth. Back both up first."],
      ["BL-030", "P3", "The continuous stream path (`stream_to_api.py`) still samples the whole dataset."],
    ],
  },
  L: {
    name: "Detector", x: 8, y: 8, w: 2.6, d: 2.6, h: 1.9,
    sub: "the frozen classifier that raises the alerts",
    what: [
      "A conventional machine-learning model looks at each flow and says attack or harmless. For an attack, a second model names the attack family and SHAP lists which features pushed it there.",
      "It is **frozen**: same weights and thresholds in every arm. It is an input to the experiment, not something being tested.",
    ],
    built: [
      "`src/memsoc/detection/`, with two LightGBM pickles in `models/` (binary, and a 37 MB multiclass).",
      "Served by its own app, `memsoc.api.app_detection`, default port 8000. `POST /api/logs` takes one NetFlow record and returns verdict + SHAP + alert.",
      "The pickles load at startup, so the health check only passes once the model is really ready.",
    ],
    inside: [
      "`validate_input`: all 48 features present.",
      "`prepare_dataframe`.",
      "`binary_prediction`: attack or benign. Benign stops here.",
      "`multiclass_prediction`: which attack family.",
      "SHAP: which features drove the call.",
      "`AlertGenerator` builds the alert record.",
    ],
    cond: [
      ["BL-027", "P1", "`run_training.py` hardcodes a dataset path that does not exist."],
      ["BL-075", "P2", "Emits no version identifier, so memory stores `detector_version = \"unknown\"`."],
      ["BL-029", "P2", "The alert carries no uid, so it cannot be joined back to its flow from the alert alone."],
      ["BL-182", "P3", "It does raise false alarms on unseen benign traffic, though the paper can read as if it never does."],
      ["BL-160", "P3", "It names the family better than every LLM arm (82.4% on the same alerts); nothing yet shows the LLM adds value over it."],
    ],
  },
  C: {
    name: "Live capture", x: 12, y: 8, w: 2, d: 2, h: 0.7,
    sub: "saves the detector's answers to a file",
    what: [
      "Sends the stream through the detector and saves every answer. That file is **the hand-off**: everything after this point reads the file and never calls the detector again.",
    ],
    built: [
      "`src/memsoc/triage/live_capture.py` writes `artifacts/model_outputs/live_results.jsonl`.",
      "Flags: `--loop`, `--interval`, `--reset`.",
    ],
    inside: [
      "Read `generated_logs.jsonl` in order.",
      "POST each flow to `/api/logs`.",
      "Append the detector's full JSON response to `live_results.jsonl`.",
    ],
    cond: [
      ["BL-021", "P3", "The file is append-only across runs unless `--reset` is passed, so one report can mix two unrelated runs."],
      ["BL-026", "P2", "Records carry `src_ip` and `dst_ip` at top level, which a careless case renderer would pick up."],
    ],
  },
  T: {
    name: "Triage runner", x: 16, y: 8, w: 2.6, d: 2.6, h: 1.4,
    sub: "takes one alert from start to verdict",
    what: [
      "The heart of the loop. For each flagged alert it asks memory for precedent, builds the prompt, calls the LLM, checks the reply and logs the verdict.",
      "Arm A and Arm B are **this same code**. The only thing that changes is which memory object it is handed.",
    ],
    built: [
      "`src/memsoc/triage/triage_runner.py`: `triage_alert()` and `write_back()`. `--memory off|self|oracle` picks the arm.",
      "Two seams only: `mem.retrieve()` before the prompt, `mem.write()` after the verdict is logged. Under `off` both are no-ops inside the memory layer, not branches here.",
      "Never calls the detection API and never reads `ground_truth.csv`.",
    ],
    inside: [
      "`cases = mem.retrieve(record, flow)`. Empty in Arm A.",
      "`triage_prompt.render(record, flow, cases)`.",
      "Measure the precedent block's size, in characters.",
      "`llm_client.call_triage_llm(prompt)`.",
      "`parse_llm_response`: validate the reply.",
      "Append the verdict row to `triage_verdicts.jsonl`.",
      "`write_back()`: `mem.write(...)`, only after the row is safely on disk.",
    ],
    cond: [
      ["BL-136", "P2", "Nothing stops two runners working on the same run id at once."],
      ["BL-127", "P2", "Parse and truncation retries re-send with no pacing, which sets off rate-limit errors."],
      ["BL-128", "P4", "Parse retries re-send an identical prompt, so at temperature 0 they are close to useless."],
    ],
  },
  P: {
    name: "Prompt template", x: 20, y: 8, w: 2, d: 2, h: 0.9,
    sub: "the page of text the LLM actually reads",
    what: [
      "It shows the detector's guess, its confidence, the SHAP evidence and the flow's real values. The detector's label is offered as a hypothesis the analyst may overrule.",
      "In the memory arms a block of past cases is added. **Nothing else differs between arms.**",
    ],
    built: [
      "`src/memsoc/triage/triage_prompt.py`: `render(record, flow, cases)` and `parse_llm_response()`. A protected component.",
      "Verdicts: `true_positive`, `false_positive`, `inconclusive`. Eight detector families plus `none` and `unknown`. The top 8 SHAP features are shown.",
      "`_render_precedents()` writes the memory block. The label-free variant drops the `Attack category:` and `Reasoning:` lines (approved, BL-170).",
    ],
    inside: [
      "`build_alert_view`.",
      "`_render_flow`: the NetFlow values.",
      "`_render_shap`: the top 8 attributions.",
      "`_render_precedents`: only when cases were retrieved.",
      "`parse_llm_response`: enforce the required keys and vocabulary.",
    ],
    cond: [
      ["BL-106", "P1 · blocked", "The verdict schema cannot express the escalation metric now treated as primary; fixing it touches this protected component."],
      ["BL-018", "P2", "Baseline prompt strength is unvalidated, so Arm A may be unfairly weak."],
      ["BL-181", "P2", "Benign alerts show the detector score as 1.0, not its real value."],
      ["BL-149", "P3", "It cannot name Worms: the vocabulary lists eight families."],
    ],
  },
  M: {
    name: "LLM", x: 24, y: 8, w: 2.6, d: 2.6, h: 2.2,
    sub: "the language model that makes the call",
    what: [
      "It gets one prompt per alert and answers once. Same model, same settings, in every arm.",
      "Three models were tested: **Gemma 4 26B** (the main result), gpt-oss-20b and Qwen 3.8 27B.",
    ],
    built: [
      "`src/memsoc/triage/llm_client.py`: `call_triage_llm()` goes to Groq or Gemini, chosen once by `config.TRIAGE_PROVIDER`. Plain `requests`, no SDK.",
      "Temperature 0. Handles 429 retries, truncation retries and a daily request budget.",
      "The aggregate report path shares the same client (`call_groq`).",

function steps(arm) {
  const head = [
    { p: [[0, 8], [4, 8]], n: ["D", "G"], t: "A sample of held-out flows is drawn from the dataset. Seed 42, so the order is always the same." },
    { p: [[4, 8], [8, 8]], n: ["G", "L"], t: "Each flow is posted to the detector at POST /api/logs." },
    { p: [[8, 8], [12, 8]], n: ["L", "C"], t: "The frozen detector answers with a label, a score and its top SHAP features. Live capture saves the answer." },
    { p: [[12, 8], [16, 8]], n: ["C", "T"], t: "The triage runner picks up each alert the detector flagged." },
  ];
  const call = [
    { p: [[20, 8], [24, 8]], n: ["P", "M"], t: "The LLM is called once, at temperature 0." },
    { p: [[24, 8], [28, 8]], n: ["M", "V"], t: "It returns a verdict, an attack family, a confidence and a rationale. One line is logged." },
  ];
  const score = { p: [[28, 8], [28, 13.5]], n: ["V", "K", "O"], t: "After the run, the scoring harness marks the verdicts against the held-out ground truth." };

  if (arm === "off") {
    return head.concat(
      [{ p: [[16, 8], [20, 8]], n: ["T", "P"], t: "Memory is off. The prompt is built with no precedent block." }],
      call,
      [{ p: [[28, 8], [28, 8]], n: ["V"], t: "Nothing is written back. The off switch is an object that does nothing, so Arm A cannot touch the store." }],
      [score]);
  }
  const write = arm === "oracle"
    ? "The case is written back, but the true label replaces the model's verdict. That makes this arm a ceiling, not a deployable system."
    : "The case is written back with the model's own verdict, right or wrong. A mistake stored here can be copied by later alerts.";
  return head.concat(
    [
      { p: [[16, 8], [16, 4], [16, 1], [20, 1]], n: ["T", "S", "X", "E"], t: "Memory is on. The alert is rendered as case text and turned into a vector of 384 numbers." },
      { p: [[20, 1], [20, 4], [24, 4], [24, 2]], n: ["E", "R", "Q"], t: "The read path searches the case store for the 3 most similar earlier cases." },
      { p: [[24, 2], [24, 4], [20, 4], [20, 8]], n: ["Q", "R", "P"], t: "Those cases are pasted into the prompt as precedent. The rest of the prompt is the same in every arm." },
    ],
    call,
    [{ p: [[28, 8], [28, 4], [28, 2], [24, 2]], n: ["V", "W", "Q"], t: write }],
    [score]);
}

function drawBox(g, n, z0, z1, pre) {
  const x0 = n.x - n.w / 2, x1 = n.x + n.w / 2, y0 = n.y - n.d / 2, y1 = n.y + n.d / 2;
  el("polygon", { class: "face", fill: `url(#${pre}-left)`, points: pts([iso(x0, y1, z1), iso(x1, y1, z1), iso(x1, y1, z0), iso(x0, y1, z0)]) }, g);
  el("polygon", { class: "face", fill: `url(#${pre}-right)`, points: pts([iso(x1, y0, z1), iso(x1, y1, z1), iso(x1, y1, z0), iso(x1, y0, z0)]) }, g);
  return el("polygon", { class: "face", fill: `url(#${pre}-top)`, points: pts([iso(x0, y0, z1), iso(x1, y0, z1), iso(x1, y1, z1), iso(x0, y1, z1)]) }, g);
}

function build() {
  /* ground grid */
  const gg = el("g", {}, world);
  for (let x = -2; x <= 36; x += 2) el("line", { class: "gridline", x1: iso(x, -2)[0], y1: iso(x, -2)[1], x2: iso(x, 18)[0], y2: iso(x, 18)[1] }, gg);
  for (let y = -2; y <= 18; y += 2) el("line", { class: "gridline", x1: iso(-2, y)[0], y1: iso(-2, y)[1], x2: iso(36, y)[0], y2: iso(36, y)[1] }, gg);

  /* memory region */
  el("polygon", { class: "region", points: pts([iso(14.6, -0.8), iso(29.6, -0.8), iso(29.6, 5.7), iso(14.6, 5.7)]) }, world);
  const gt = (x, y, text, cls) => {
    const p = iso(x, y);
    const t = el("text", { class: "gtext " + (cls || ""), transform: `matrix(.866,.5,-.866,.5,${p[0].toFixed(1)},${p[1].toFixed(1)})` }, world);
    t.textContent = text;
  };
  GROUND_TEXT.forEach((g) => gt(g[0], g[1], g[2]));
  gt(14.8, -1.1, "LAYER 3 · MEMORY — THE ONE VARIABLE", "mem only-on");
  gt(14.8, -1.1, "LAYER 3 · MEMORY — SWITCHED OFF IN ARM A", "mem only-off");

  /* edges, under the blocks */
  const ge = el("g", {}, world);
  EDGES.forEach(([a, b, via, flag]) => {
    const A = NODES[a], B = NODES[b];
    const path = [[A.x, A.y]].concat(via || [], [[B.x, B.y]]);
    const cls = "edge" + (flag ? " " + flag : "");
    el("polyline", { class: cls, points: pts(path.map((p) => iso(p[0], p[1]))) }, ge);
    const prev = path[path.length - 2];
    let ex = B.x, ey = B.y;
    if (Math.abs(prev[1] - B.y) < 0.01) ex = B.x - Math.sign(B.x - prev[0]) * (B.w / 2);
    else ey = B.y - Math.sign(B.y - prev[1]) * (B.d / 2);
    const d = iso(ex, ey);
    el("circle", { class: "dot" + (flag === "mem" ? " mem" : ""), cx: d[0], cy: d[1], r: 2.6 }, ge);
  });

  trail = el("polyline", { class: "trail", points: "" }, world);

  /* blocks, far to near */
  const labels = [];
  const order = Object.keys(NODES).sort((a, b) => (NODES[a].x + NODES[a].y) - (NODES[b].x + NODES[b].y));
  order.forEach((id) => {
    const n = NODES[id];
    const g = el("g", { class: "node" + (n.mem ? " mem" : ""), "data-id": id }, world);
    const pre = n.mem ? "m" : "p";
    let top;
    if (n.slabs) {
      const each = n.h / n.slabs;
      for (let i = 0; i < n.slabs; i++) top = drawBox(g, n, i * each, i * each + each * 0.72, pre);
      n.topZ = (n.slabs - 1) * each + each * 0.72;
    } else {
      top = drawBox(g, n, 0, n.h, pre);
      n.topZ = n.h;
    }
    top.classList.add("top");
    const c = iso(n.x, n.y, n.topZ);
    el("text", { class: "letter", x: c[0], y: c[1] + 4 }, g).textContent = id;
    const f = iso(n.x + n.w / 2, n.y + n.d / 2, 0);
    labels.push([f[0], f[1] + 13, n.name, n.mem]);
    nodeEls[id] = g;
  });
  const gl = el("g", {}, world);
  labels.forEach((l) => (el("text", { class: "name" + (l[3] ? " mem" : ""), x: l[0], y: l[1] }, gl).textContent = l[2]));

  token = el("circle", { class: "token", r: 6, cx: 0, cy: 0, visibility: "hidden" }, world);

  /* sidebar */
  const nav = $("nav");
  GROUPS.forEach(([title, ids]) => {
    const h = document.createElement("h2");
    h.textContent = title;
    nav.appendChild(h);
    ids.forEach((id) => {
      const n = NODES[id];
      const b = document.createElement("button");
      b.className = "row" + (n.mem ? " mem" : "");
      b.dataset.id = id;
      b.title = n.cond.length + " open backlog rows";
      b.innerHTML = `<span class="k">${id}</span><span>${n.name}</span><span class="n">${n.cond.length}</span>`;
      nav.appendChild(b);
    });
  });
}

/* ------------------------------------------------------------------
   View: pan and zoom
   ------------------------------------------------------------------ */

const view = { x: 0, y: 0, k: 1 };

function applyView() {
  world.setAttribute("transform", `translate(${view.x.toFixed(1)},${view.y.toFixed(1)}) scale(${view.k.toFixed(3)})`);
  svg.classList.toggle("far", view.k < 0.6);
}

function fit() {
  const corners = [iso(-1.5, 15), iso(34.5, -1.5), iso(-1.5, -1.5, 2), iso(34.5, 17.5)];
  const xs = corners.map((c) => c[0]), ys = corners.map((c) => c[1]);
  const minX = Math.min(...xs), maxX = Math.max(...xs), minY = Math.min(...ys), maxY = Math.max(...ys);
  const r = svg.getBoundingClientRect();
  const padX = 24, padTop = 16, padBottom = 84;
  view.k = Math.min((r.width - padX * 2) / (maxX - minX), (r.height - padTop - padBottom) / (maxY - minY));
  view.k = Math.max(0.3, Math.min(view.k, 1.6));
  view.x = (r.width - (maxX - minX) * view.k) / 2 - minX * view.k;
  view.y = padTop + (r.height - padTop - padBottom - (maxY - minY) * view.k) / 2 - minY * view.k;
  applyView();
}

function zoomAt(cx, cy, factor) {
  const k = Math.max(0.3, Math.min(4, view.k * factor));
  view.x = cx - (cx - view.x) * (k / view.k);
  view.y = cy - (cy - view.y) * (k / view.k);
  view.k = k;
  applyView();
}

let drag = null, moved = false;
svg.addEventListener("pointerdown", (e) => {
  drag = { x: e.clientX, y: e.clientY, vx: view.x, vy: view.y };
  moved = false;
});
window.addEventListener("pointermove", (e) => {
  if (!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (!moved && Math.hypot(dx, dy) < 4) return;
  moved = true;
  svg.classList.add("dragging");
  view.x = drag.vx + dx;
  view.y = drag.vy + dy;
  applyView();
});
window.addEventListener("pointerup", () => { drag = null; svg.classList.remove("dragging"); });
svg.addEventListener("wheel", (e) => {
  e.preventDefault();
  const r = svg.getBoundingClientRect();
  zoomAt(e.clientX - r.left, e.clientY - r.top, e.deltaY < 0 ? 1.12 : 1 / 1.12);
}, { passive: false });
const zoomCentre = (f) => { const r = svg.getBoundingClientRect(); zoomAt(r.width / 2, r.height / 2, f); };
$("z-in").onclick = () => zoomCentre(1.25);
$("z-out").onclick = () => zoomCentre(1 / 1.25);

/* ------------------------------------------------------------------
   Panel
   ------------------------------------------------------------------ */

const state = { arm: "self", sel: null, tab: "what", step: -1, playing: false };

const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
const fmt = (s) => esc(s).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<mark>$1</mark>");
const paras = (list) => list.map((p) => `<p>${fmt(p)}</p>`).join("");

function overview() {
  const on = (a) => (state.arm === a ? ' class="col-on"' : "");
  return `
    <span class="lbl">MemSOC · as of 2026-11-15</span>
    <h1>The Triage Loop and Its One Switch</h1>
    <p class="sub">how an alert gets raised, judged, remembered and marked</p>

    <h3>What this is</h3>
    ${paras([
      "This repository is a security alert triage system that **tests one idea**: does an LLM judge alerts better when it can look up how similar alerts were judged before?",
      "A detector raises alerts. An LLM gives each one a verdict. In Arm B, a memory layer shows the LLM the three most similar past cases first, then stores the new case. In Arm A that layer is switched off. **Everything else is identical**, so any difference comes from memory.",
      "The diagram is the path of one alert. The solid line from Dataset to Verdict log is the main path. The red blocks beside it are the memory layer. Ground truth and the scoring harness do the marking afterwards, and the branch off Live capture produces the report.",
    ])}

    <h3>What it found</h3>
    <table>
      <thead><tr><th></th><th${on("off")}>Arm A</th><th${on("self")}>B-self</th><th${on("oracle")}>B-oracle</th></tr></thead>
      <tbody>
        <tr><td>Attacks caught</td><td${on("off")}>74.5%</td><td${on("self")}>86.7%</td><td${on("oracle")}>98.8%</td></tr>
        <tr><td>Family named right</td><td${on("off")}>54.5%</td><td${on("self")}>23.6%</td><td${on("oracle")}>69.1%</td></tr>
        <tr><td>Harmless flows escalated</td><td${on("off")}>63 / 100</td><td${on("self")}>98 / 100</td><td${on("oracle")}>not run</td></tr>
        <tr><td>Seconds per alert</td><td${on("off")}>40.4</td><td${on("self")}>21.5</td><td${on("oracle")}>27.1</td></tr>
      </tbody>
    </table>
    <p class="note">Gemma 4 26B, temperature 0. The first two rows and the timing are the same 165 attack alerts in every arm (protocol v3). The third row is 100 hard benign flows (protocol v4). One run per condition.</p>
    ${paras([
      "**Memory changes the decisions a lot, and what is stored decides whether that helps.** The model largely copies the attack family of the cases it is shown: 97.6% of the time for Gemma.",
      "With true labels in memory (B-oracle) it helps. With the model's own unchecked verdicts (B-self) one mistake spreads: every one of the 143 attacks B-self caught was labelled Fuzzers.",
    ])}

    <h3>Five follow-up tests · protocol v4</h3>
    <ol>
      <li><span>${fmt("**Shuffled labels.** Family accuracy fell from 69.1% to 47.3%, below no memory. Correct labels are what make B-oracle work.")}</span></li>
      <li><span>${fmt("**No family stored.** Family accuracy recovered, 23.6% to 57.6%, but recall fell to 70.3%.")}</span></li>
      <li><span>${fmt("**Hard benign, no memory.** 63 of 100 harmless flows escalated.")}</span></li>
      <li><span>${fmt("**Hard benign, memory full of attacks.** 98 of 100 escalated. The clearest harm found.")}</span></li>
      <li><span>${fmt("**Reversed order.** The family harm stayed (29.7%). The recall gain did not: 66.1%, below Arm A. So that gain is not robust.")}</span></li>
    </ol>

    <h3>State of the build</h3>
    ${paras([
      "Phases 0 to 4 are marked done in the README: setup, the baseline, the memory arm, tuning and evaluation. **Phase 5, the reporting layer, is in progress**: the technical report exists, the plain-language view does not (BL-008).",
      "The backlog holds 174 rows: 54 done, 116 open, 3 in progress, 1 blocked. Several rows from earlier phases are still open there, including the explicit error-propagation test (BL-004). The number beside each component on the left is how many open rows are listed for it here.",
      "Three services run by default: detection on port 8000, reports on 8001, and the dashboard and API gateway on 8080.",
    ])}

    <h3>How to read it</h3>
    ${paras([
      "Pick an **arm** in the top bar to see the layer switch on and off. **Run the flow** walks one alert through the loop; **Trace one step** moves it a step at a time.",
      "Click a block for a plain description. **How it's built** gives the files and settings, **Inside** lists its steps in order, and **Condition** lists what the backlog says is still wrong with it.",
    ])}

    <h3>Sources</h3>
    <p class="note">${fmt("`README.md`, `PROJECT_BRIEF.md`, `docs/results-of-5-tests/README.md`, `docs/status/executive-summary.md`, `docs/PRODUCT_BACKLOG.md`, and the module docstrings under `src/memsoc/`. Figures were typed in by hand and are not read live (BL-198).")}</p>`;
}

function renderPanel() {
  const tabs = $("tabs"), panel = $("panel");
  if (!state.sel) {
    tabs.classList.add("hidden");
    panel.innerHTML = overview();
    panel.scrollTop = 0;
    return;
  }
  const n = NODES[state.sel];
  tabs.classList.remove("hidden");
  tabs.querySelectorAll("button").forEach((b) => {
    b.setAttribute("aria-selected", b.dataset.tab === state.tab);
    if (b.dataset.tab === "cond") b.textContent = `Condition · ${n.cond.length}`;
  });
  let body = "";
  if (state.tab === "what") body = `<h3>What it does</h3>${paras(n.what)}`;
  if (state.tab === "built") body = `<h3>How it's built</h3>${paras(n.built)}`;
  if (state.tab === "inside") {
    body = "<h3>Its steps, in order</h3>" + (n.inside
      ? `<ol>${n.inside.map((s) => `<li><span>${fmt(s)}</span></li>`).join("")}</ol>`
      : '<p class="note">Nothing to step through here. See the other tabs.</p>');
  }
  if (state.tab === "cond") {
    body = "<h3>Open in the backlog</h3>" + n.cond.map((c) =>
      `<div class="bl"><span class="id">${c[0]}<i>${c[1]}</i></span><span>${fmt(c[2])}</span></div>`).join("") +
      '<p class="note" style="margin-top:12px">A selection of open rows from <code>docs/PRODUCT_BACKLOG.md</code>, shortened. The backlog is the authority.</p>';
  }
  panel.innerHTML = `
    <button class="back" id="back">← Overview</button><br>
    <span class="lbl">${state.sel} · ${n.mem ? "memory layer" : "component"}</span>
    <h1>${n.name}</h1>
    <p class="sub">${fmt(n.sub)}</p>
    ${body}`;
  $("back").onclick = () => select(null);
  panel.scrollTop = 0;
}

function select(id, tab) {
  state.sel = id;
  state.tab = tab || "what";
  Object.entries(nodeEls).forEach(([k, g]) => g.classList.toggle("sel", k === id));
  document.querySelectorAll(".row").forEach((r) => r.classList.toggle("sel", r.dataset.id === id));
  renderPanel();
}

/* ------------------------------------------------------------------
   Arms and the flow
   ------------------------------------------------------------------ */

let raf = 0, timer = 0;

function setArm(arm) {
  state.arm = arm;
  svg.classList.toggle("arm-off", arm === "off");
  document.querySelectorAll(".arms button").forEach((b) => b.setAttribute("aria-pressed", b.dataset.arm === arm));
  $("s-recall").textContent = ARMS[arm].recall;
  $("s-family").textContent = ARMS[arm].family;
  $("s-benign").textContent = ARMS[arm].benign;
  stopFlow(true);
  if (!state.sel) renderPanel();
}

function stopFlow(clear) {
  cancelAnimationFrame(raf);
  clearTimeout(timer);
  state.playing = false;
  $("b-run").textContent = "▶ Run the flow";
  if (clear) {
    state.step = -1;
    trail.setAttribute("points", "");
    token.setAttribute("visibility", "hidden");
    $("caption").classList.remove("on");
    Object.values(nodeEls).forEach((g) => g.classList.remove("act"));
  }
}

function showStep(i, done) {
  const list = steps(state.arm);
  state.step = i;
  const s = list[i];
  const screen = s.p.map((p) => iso(p[0], p[1]));
  Object.entries(nodeEls).forEach(([k, g]) => g.classList.toggle("act", s.n.includes(k)));
  trail.setAttribute("points", pts(screen));
  $("cap-n").textContent = `${ARMS[state.arm].label} · step ${String(i + 1).padStart(2, "0")} of ${String(list.length).padStart(2, "0")}`;
  $("cap-t").textContent = s.t;
  $("caption").classList.add("on");
  token.setAttribute("visibility", "visible");

  const seg = [];
  let total = 0;
  for (let j = 1; j < screen.length; j++) {
    const len = Math.hypot(screen[j][0] - screen[j - 1][0], screen[j][1] - screen[j - 1][1]);
    seg.push(len);
    total += len;
  }
  const place = (t) => {
    let dist = t * total, j = 0;
    while (j < seg.length - 1 && dist > seg[j]) { dist -= seg[j]; j++; }
    const f = seg[j] ? dist / seg[j] : 0;
    token.setAttribute("cx", screen[j][0] + (screen[j + 1][0] - screen[j][0]) * f);
    token.setAttribute("cy", screen[j][1] + (screen[j + 1][1] - screen[j][1]) * f);
  };
  cancelAnimationFrame(raf);
  const still = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (still || total === 0) { place(1); if (done) done(); return; }
  const dur = 500 + total * 2.2, t0 = performance.now();
  const tick = (now) => {
    const t = Math.min(1, (now - t0) / dur);
    place(t);
    if (t < 1) raf = requestAnimationFrame(tick);
    else if (done) done();
  };
  raf = requestAnimationFrame(tick);
}

function nextIndex() { return (state.step + 1) % steps(state.arm).length; }

function play() {
  if (!state.playing) return;
  showStep(nextIndex(), () => { timer = setTimeout(play, 2600); });
}

$("b-run").onclick = () => {
  if (state.playing) { stopFlow(false); return; }
  state.playing = true;
  $("b-run").textContent = "❚❚ Pause the flow";
  play();
};
$("b-step").onclick = () => { stopFlow(false); showStep(nextIndex()); };
$("b-reset").onclick = () => { stopFlow(true); fit(); };
document.querySelectorAll(".arms button").forEach((b) => (b.onclick = () => setArm(b.dataset.arm)));

/* ------------------------------------------------------------------
   Wiring
   ------------------------------------------------------------------ */

build();

const tip = $("tip");
world.addEventListener("pointermove", (e) => {
  const g = e.target.closest(".node");
  if (!g || drag) { tip.style.display = "none"; return; }
  const n = NODES[g.dataset.id];
  tip.innerHTML = `<b>${g.dataset.id} · ${n.name}</b>${esc(n.sub)}`;
  tip.style.display = "block";
  tip.style.left = Math.min(e.clientX + 14, window.innerWidth - 310) + "px";
  tip.style.top = e.clientY + 16 + "px";
});
world.addEventListener("pointerleave", () => (tip.style.display = "none"));
svg.addEventListener("click", (e) => {
  if (moved) return;
  const g = e.target.closest(".node");
  select(g ? g.dataset.id : null);
});
svg.addEventListener("dblclick", (e) => {
  const g = e.target.closest(".node");
  if (g) select(g.dataset.id, "inside");
});
$("nav").addEventListener("click", (e) => {
  const r = e.target.closest(".row");
  if (r) select(r.dataset.id);
});
$("tabs").addEventListener("click", (e) => {
  const b = e.target.closest("button");
  if (b) { state.tab = b.dataset.tab; renderPanel(); }
});
window.addEventListener("keydown", (e) => {
  if (e.target.closest && e.target.closest("button") && (e.key === "Enter" || e.key === " ")) return;
  if (e.key === "ArrowDown" || e.key === "ArrowUp") {
    e.preventDefault();
    const i = ORDER.indexOf(state.sel);
    const j = e.key === "ArrowDown" ? (i + 1) % ORDER.length : (i <= 0 ? ORDER.length - 1 : i - 1);
    select(ORDER[j]);
  } else if (e.key === "Enter" && state.sel) {
    select(state.sel, "inside");
  } else if (e.key === "Escape") {
    select(null);
  } else if (e.key === " ") {
    e.preventDefault();
    $("b-run").click();
  }
});
window.addEventListener("resize", fit);

setArm("self");
renderPanel();
fit();
</script>
</body>
</html>
